# bug-age: library and single CLI binary. Runtime dependencies are kept to regex, serde and sha2.
[package]
name = "bug-age"
version = "1.0.0"
description = "Measure how long bugs lived in a git repository"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
