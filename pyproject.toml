# SPDX-License-Identifier: MIT OR Apache-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-age"
version = "2.2.1"
description = "Measure how long bugs lived in a git repository, counting only bugs whose fix commit message says fix, bug or hotfix."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Source = "https://github.com/jacob-adm/bug-age"

[project.scripts]
bug-age = "bug_age.cli:main"

[tool.setuptools]
packages = ["bug_age"]

[tool.setuptools.package-data]
bug_age = ["data/Dockerfile", "data/python.Dockerfile", "data/bundle.schema.json", "data/explorer.html"]
