# Continuous integration: every pull request and every push to main.
# The job names below are the required status checks on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit, contract and end-to-end tests; --locked fails if Cargo.lock is out of date.
      - name: cargo test
        run: cargo test --workspace --locked
      # The example runs' clones, so the oracle test can regenerate them (full history: blame and tags).
      - name: clone example targets
        run: |
          git clone -q https://github.com/huggingface/tokenizers work/tokenizers
          git clone -q https://github.com/modelcontextprotocol/rust-sdk work/rust-sdk
      # Python port: unit tests, and the oracle that regenerates both runs and compares byte for byte.
      - name: python tests
        run: python3 -m unittest discover -s tests
        env:
          BUG_AGE_FRESH_CLONES: "1"
      # Fails if any number in the article is not a reference into a committed bundle.
      - name: article numbers trace to the bundle
        run: python3 scripts/article.py article/ARTICLE.tmpl.md --bundle tokenizers=dist/tokenizers/bundle.json --bundle rust-sdk=dist/rust-sdk/bundle.json
      # Fails if results/TIMINGS.md or the README timing table no longer match the committed run records.
      - name: timing tables match the run records
        run: python3 scripts/timings.py --check
