# Continuous integration: every pull request and every push to main.
# The job names below are the required status checks on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the comparison with v1.0.2's published bundles
      # cargo builds the toy crate in the Method B tests (the rust profile); bug-age itself is Python.
      - uses: dtolnay/rust-toolchain@1.86.0
      # The example runs' clones, so the oracle test can regenerate them (full history: blame and tags).
      - name: clone example targets
        run: |
          git clone -q https://github.com/huggingface/tokenizers work/tokenizers
          git clone -q https://github.com/modelcontextprotocol/rust-sdk work/rust-sdk
      # Oldest and newest supported Python, one after the other, so the required check names stay one per OS.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: python 3.11 tests
        run: python -m unittest discover -s tests
        env:
          BUG_AGE_FRESH_CLONES: "1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: python 3.13 tests
        run: python -m unittest discover -s tests
        env:
          BUG_AGE_FRESH_CLONES: "1"
      # The package installs and runs with no dependencies.
      - name: install
        run: |
          python -m pip install .
          bug-age --version
      # Fails if any number in the article is not a reference into a committed bundle.
      - name: article numbers trace to the bundle
        run: python3 scripts/article.py article/ARTICLE.tmpl.md --bundle tokenizers=dist/tokenizers/bundle.json --bundle rust-sdk=dist/rust-sdk/bundle.json
      # Fails if results/TIMINGS.md or the timing table in docs/timings.md no longer match the committed run records.
      - name: timing tables match the run records
        run: python3 scripts/timings.py --check
